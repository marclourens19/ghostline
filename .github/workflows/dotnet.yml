name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore Dependencies
        run: dotnet restore tests/Ghostline.Simulation.Tests/Ghostline.Simulation.Tests.csproj

      - name: Build Backend & Test Suite
        run: dotnet build tests/Ghostline.Simulation.Tests/Ghostline.Simulation.Tests.csproj --no-restore --configuration Release

      - name: Run Test Suite
        run: dotnet test tests/Ghostline.Simulation.Tests/Ghostline.Simulation.Tests.csproj --no-build --configuration Release --verbosity normal