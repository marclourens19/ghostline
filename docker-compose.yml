services:
  postgres:
    image: postgres:16-alpine
    container_name: ghostline_postgres
    environment:
      POSTGRES_USER: ghostline_dev
      POSTGRES_PASSWORD: dev_password_123!
      POSTGRES_DB: ghostline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostline_dev -d ghostline"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: