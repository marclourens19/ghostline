services:
  postgres:
    image: postgres:16-alpine
    container_name: ghostline_postgres
    environment:
      POSTGRES_USER: ghostline_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ghostline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostline_dev -d ghostline"]
      interval: 5s
      timeout: 5s
      retries: 5

  ghostline_api:
    build:
      context: .
      dockerfile: src/Ghostline.Api/Dockerfile
    container_name: ghostline_api
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=ghostline;Username=ghostline_dev;Password=${POSTGRES_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Production
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: